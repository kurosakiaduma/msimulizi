name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Repository hygiene ────────────────────────────────────────────────────
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for commit-date check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run hygiene check
        run: python scripts/check_repo_hygiene.py

  # ── Lint (ruff) ───────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  # ── Backend tests (pytest) ────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  # ── Frontend tests (Vitest) ───────────────────────────────────────────────
  # NOTE: This job is skipped until frontend/ is scaffolded (task 25).
  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check whether frontend is scaffolded
        id: frontend-check
        run: |
          if [ -f "package.json" ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not found — skipping Vitest (frontend not yet scaffolded)"
          fi

      - uses: actions/setup-node@v4
        if: steps.frontend-check.outputs.scaffolded == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-check.outputs.scaffolded == 'true'
        run: npm ci

      - name: Run Vitest
        if: steps.frontend-check.outputs.scaffolded == 'true'
        run: npx vitest run

  # ── Validation script (generator calibration) ────────────────────────────
  # NOTE: This job is skipped until generator/validate.py is implemented (task 10).
  validate-generator:
    name: Generator calibration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check whether validate.py exists
        id: validate-check
        run: |
          if [ -f "generator/validate.py" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "generator/validate.py not found — skipping validation (added in task 10)"
          fi

      - name: Run generator validation
        if: steps.validate-check.outputs.exists == 'true'
        run: python generator/validate.py

  # ── Deployment is deliberately NOT part of CI ─────────────────────────────
  # CI must be read-only with respect to Azure. It never logs in, provisions,
  # creates an azd environment, or deploys to an existing environment.
  #
  # Deployments are explicit operator actions:
  #   azd env select msimulizi-demo2
  #   azd deploy
  # The live runbook is local-only in docs/azure-resources-and-env.md and
  # docs/azure-production-guide.md (gitignored).

