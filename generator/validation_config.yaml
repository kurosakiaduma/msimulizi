# The generator emits a highlight feed (goals plus scripted key events), not
# every attempt in a 90-minute match. `total_shots` counts shot events present
# in that feed, so these bands are deliberately narrower than full-match
# StatsBomb shot counts. Goals and xG remain comparable and are still checked.
comeback_from_two_down:
  total_shots:
    min: 3
    max: 12
  goals_home:
    min: 2
    max: 5
  goals_away:
    min: 1
    max: 4
  xg_home:
    min: 0.5
    max: 3.0
  xg_away:
    min: 0.3
    max: 2.5

red_card_shift:
  total_shots:
    min: 3
    max: 12
  goals_home:
    min: 1
    max: 4
  goals_away:
    min: 0
    max: 2
  xg_home:
    min: 0.4
    max: 2.8
  xg_away:
    min: 0.2
    max: 2.0

late_equaliser:
  total_shots:
    min: 3
    max: 12
  goals_home:
    min: 1
    max: 3
  goals_away:
    min: 1
    max: 3
  xg_home:
    min: 0.4
    max: 2.5
  xg_away:
    min: 0.3
    max: 2.1

