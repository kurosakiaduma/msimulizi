# Default priority ranks for Msimulizi Key Moment detection.
# The values are intentionally deterministic and shared across the project.
xg_threshold: 0.40

# Direct mapping keeps simple lookups easy while preserving a nested structure
# for configuration consumers that want one canonical dictionary.
